name: Test DVR Windows
on:
  push:
    branches: [ "fix/auto-hide-mouse-cursor", "feature/dvr-windows-nativo" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests and compilation (refresh dependency lock if needed)
        run: cargo test --release

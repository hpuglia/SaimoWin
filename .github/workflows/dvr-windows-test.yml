name: SaimoWin DVR Windows tests
on:
  push:
    branches: [ "feature/dvr-limpeza-status-v15", "feature/dvr-direto-segmentado", "fix/auto-hide-mouse-cursor" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests and release compilation
        run: cargo test --release
